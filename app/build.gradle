plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStorePassword = localProps.getProperty('RELEASE_STORE_PASSWORD', '')
def releaseKeyPassword = localProps.getProperty('RELEASE_KEY_PASSWORD', '')
def glitchTipDsn = localProps.getProperty('GLITCHTIP_DSN', '')
def glitchTipSecret = localProps.getProperty('GLITCHTIP_SECRET', '')
def elevenLabsApiKey = localProps.getProperty('ELEVENLABS_API_KEY', '')
def elevenLabsApiKeyEscaped = elevenLabsApiKey.replace('\\', '\\\\').replace('"', '\\"')
def elevenLabsVoiceId = localProps.getProperty('ELEVENLABS_VOICE_ID', '')
def elevenLabsVoiceIdEscaped = elevenLabsVoiceId.replace('\\', '\\\\').replace('"', '\\"')
def otaSignerSha256 = localProps.getProperty('OTA_SIGNER_SHA256', 'c37dc301bd0f989c559e601e63002f6f377d591267e7733b4970c60911a576d1')
def geminiApiKey = localProps.getProperty('GEMINI_API_KEY', '')
def geminiApiKeyEscaped = geminiApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.eyups.roaddeck'
    compileSdk 34
    useLibrary 'android.car'

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.eyups.roaddeck"
        minSdk 29
        targetSdk 28
        versionCode 39
        versionName "1.3.27-local"
        buildConfigField "String", "GLITCHTIP_DSN", "\"${glitchTipDsn}\""
        buildConfigField "String", "GLITCHTIP_SECRET", "\"${glitchTipSecret}\""
        buildConfigField "String", "ELEVENLABS_API_KEY", "\"${elevenLabsApiKeyEscaped}\""
        buildConfigField "String", "ELEVENLABS_VOICE_ID", "\"${elevenLabsVoiceIdEscaped}\""
        buildConfigField "String", "OTA_SIGNER_SHA256", "\"${otaSignerSha256}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKeyEscaped}\""
        // TTS flavor varsayılanları; tts30/tts40 flavor'ları ezer.
        buildConfigField "boolean", "TTS_DIRECT", "false"
        buildConfigField "boolean", "TTS_IS_40", "false"
        buildConfigField "String", "TTS_FLAVOR", "\"none\""
        buildConfigField "String", "TTS_LIB_NAME", "\"\""
        buildConfigField "String", "TTS_RES_PATH", "\"\""
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    flavorDimensions "tts"
    productFlavors {
        tts30 {
            dimension "tts"
            versionNameSuffix "-tts30"
            buildConfigField "boolean", "TTS_DIRECT", "true"
            buildConfigField "boolean", "TTS_IS_40", "false"
            buildConfigField "String", "TTS_FLAVOR", "\"tts30\""
            buildConfigField "String", "TTS_LIB_NAME", "\"issxtts30\""
            buildConfigField "String", "TTS_RES_PATH", "\"/vr/iflytek/res/xTTSRes\""
        }
        tts40 {
            dimension "tts"
            versionNameSuffix "-tts40"
            buildConfigField "boolean", "TTS_DIRECT", "true"
            buildConfigField "boolean", "TTS_IS_40", "true"
            buildConfigField "String", "TTS_FLAVOR", "\"tts40\""
            buildConfigField "String", "TTS_LIB_NAME", "\"issxtts40\""
            buildConfigField "String", "TTS_RES_PATH", "\"/vr/iflytek/resvr/xTTS40Res\""
        }
        ttsService {
            dimension "tts"
            versionNameSuffix "-tts-service"
            // Eski davranış: iFlytek AIDL servisi. Native lib paketlenmez.
            buildConfigField "boolean", "TTS_DIRECT", "false"
            buildConfigField "boolean", "TTS_IS_40", "false"
            buildConfigField "String", "TTS_FLAVOR", "\"ttsService\""
            buildConfigField "String", "TTS_LIB_NAME", "\"\""
            buildConfigField "String", "TTS_RES_PATH", "\"\""
        }
    }

    sourceSets {
        tts30 {
            jniLibs.srcDirs = ['src/tts30/jniLibs']
        }
        tts40 {
            jniLibs.srcDirs = ['src/tts40/jniLibs']
        }
    }

    signingConfigs {
        release {
            storeFile file("roaddeck-release.keystore")
            storePassword releaseStorePassword
            keyAlias "mapcontrol"
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    androidResources {
        noCompress += ['onnx', 'bin', 'txt']
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
            useLegacyPackaging = true
        }
    }
}

dependencies {
    def filamentVersion = '1.53.4'
    implementation "com.google.android.filament:filament-android:${filamentVersion}"
    implementation "com.google.android.filament:gltfio-android:${filamentVersion}"
    implementation "com.google.android.filament:filament-utils-android:${filamentVersion}"

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'io.sentry:sentry-android:8.+'

    // Sesli asistan uyandırma kelimesi (opsiyonel motor; reflection ile kullanılır).
    implementation 'com.alphacephei:vosk-android:0.3.47'

    testImplementation 'junit:junit:4.13.2'
}