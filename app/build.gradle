plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStorePassword = localProps.getProperty('RELEASE_STORE_PASSWORD', '')
def releaseKeyPassword = localProps.getProperty('RELEASE_KEY_PASSWORD', '')
def glitchTipDsn = localProps.getProperty('GLITCHTIP_DSN', '')
def glitchTipSecret = localProps.getProperty('GLITCHTIP_SECRET', '')
def elevenLabsApiKey = localProps.getProperty('ELEVENLABS_API_KEY', '')
def elevenLabsApiKeyEscaped = elevenLabsApiKey.replace('\\', '\\\\').replace('"', '\\"')
def elevenLabsVoiceId = localProps.getProperty('ELEVENLABS_VOICE_ID', '')
def elevenLabsVoiceIdEscaped = elevenLabsVoiceId.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.mapcontrol'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.mapcontrol"
        minSdk 29
        targetSdk 28
        versionCode 2
        versionName "1.2.4"
        buildConfigField "String", "GLITCHTIP_DSN", "\"${glitchTipDsn}\""
        buildConfigField "String", "GLITCHTIP_SECRET", "\"${glitchTipSecret}\""
        buildConfigField "String", "ELEVENLABS_API_KEY", "\"${elevenLabsApiKeyEscaped}\""
        buildConfigField "String", "ELEVENLABS_VOICE_ID", "\"${elevenLabsVoiceIdEscaped}\""
    }

    signingConfigs {
        release {
            storeFile file("mapcontrol-release.keystore")
            storePassword releaseStorePassword
            keyAlias "mapcontrol"
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    androidResources {
        noCompress += ['onnx', 'bin', 'txt']
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
            useLegacyPackaging = true
        }
    }
}

dependencies {
    def filamentVersion = '1.53.4'
    implementation "com.google.android.filament:filament-android:${filamentVersion}"
    implementation "com.google.android.filament:gltfio-android:${filamentVersion}"
    implementation "com.google.android.filament:filament-utils-android:${filamentVersion}"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'io.sentry:sentry-android:8.+'

    testImplementation 'junit:junit:4.13.2'
}