plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mapcontrol.ttsprobe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mapcontrol.ttsprobe'
        minSdk 29
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress += ['onnx', 'bin', 'txt']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
