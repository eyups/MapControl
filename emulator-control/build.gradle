plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eyups.emulatorcontrol'
    compileSdk 34

    defaultConfig {
        applicationId "com.eyups.emulatorcontrol"
        minSdk 29
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
